<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Vintage Fork customer dashboard standalone prototype">
  <meta name="theme-color" content="#4B1638">
  <title>Vintage Fork — Customer Dashboard</title>
  <style>
    :root {
      --plum: #4B1638;
      --plum-aged: #33102A;
      --gold: #C9A227;
      --gold-light: #E0BE6B;
      --cream: #F7F1E4;
      --ivory: #FBF7EC;
      --sage: #7C8B5E;
      --forest: #3F4E36;
      --walnut: #4A3524;
      --ink: #2B2420;
      --fog: #8C8578;
      --danger: #8B2F3C;
      --danger-dark: #68212C;
      --info: #315A66;
      --white: #FFFFFF;
      --line: rgba(74, 53, 36, .20);
      --line-strong: rgba(74, 53, 36, .36);
      --shadow-1: 0 7px 20px rgba(51, 16, 42, .08);
      --shadow-2: 0 18px 48px rgba(51, 16, 42, .16);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --header-h: 72px;
      --sidebar-w: 240px;
      --content-max: 1120px;
      --ease-steeping: cubic-bezier(.2,.7,.25,1);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 320px;
      background:
        radial-gradient(circle at 14% 0%, rgba(201,162,39,.08), transparent 24rem),
        linear-gradient(180deg, var(--cream), #F3EBD9);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.55;
      min-height: 100vh;
    }
    button, input, select, textarea { font: inherit; }
    button, a, input, select, textarea { -webkit-tap-highlight-color: transparent; }
    a { color: inherit; }
    img { max-width: 100%; }
    [hidden] { display: none !important; }
    .sr-only { position:absolute !important; width:1px !important; height:1px !important; padding:0 !important; margin:-1px !important; overflow:hidden !important; clip:rect(0,0,0,0) !important; white-space:nowrap !important; border:0 !important; }

    .skip-link {
      position: fixed;
      z-index: 1000;
      left: 1rem;
      top: -5rem;
      background: var(--gold);
      color: var(--plum-aged);
      padding: .75rem 1rem;
      border-radius: var(--radius-sm);
      font-weight: 700;
    }
    .skip-link:focus { top: 1rem; }

    :focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 3px;
    }

    .app-header {
      position: fixed;
      z-index: 50;
      inset: 0 0 auto;
      height: var(--header-h);
      background: linear-gradient(105deg, var(--plum-aged), var(--plum));
      color: var(--ivory);
      border-bottom: 1px solid rgba(224,190,107,.26);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.25rem;
      box-shadow: 0 8px 24px rgba(51,16,42,.16);
    }
    .brand {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      gap: .75rem;
      color: var(--ivory);
      text-decoration: none;
    }
    .brand-mark {
      width: 38px;
      height: 38px;
      border: 1px solid rgba(224,190,107,.72);
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: var(--gold-light);
      font-size: 1.15rem;
      letter-spacing: -.06em;
      font-weight: 700;
    }
    .brand-copy { display: grid; line-height: 1.02; }
    .brand-name {
      font-size: 1.18rem;
      letter-spacing: .16em;
      text-transform: uppercase;
      font-weight: 700;
    }
    .brand-sub {
      color: var(--gold-light);
      font: 600 .67rem/1.2 Arial, sans-serif;
      letter-spacing: .22em;
      text-transform: uppercase;
      margin-top: .28rem;
    }
    /* Production: replace .brand-mark/.brand-copy with the approved shared logo asset,
       unmodified, using the dimensions and clear-space rules from the specification. */

    .header-actions { display: flex; align-items: center; gap: .65rem; }
    .header-user {
      background: transparent;
      color: var(--ivory);
      border: 0;
      min-height: 44px;
      padding: .25rem .35rem .25rem .6rem;
      display: flex;
      align-items: center;
      gap: .6rem;
      cursor: pointer;
      border-radius: var(--radius-md);
    }
    .header-user:hover { background: rgba(255,255,255,.07); }
    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--plum-aged);
      border: 1px solid rgba(224,190,107,.55);
      color: var(--gold-light);
      display: grid;
      place-items: center;
      font: 700 .86rem/1 Arial, sans-serif;
      letter-spacing: .06em;
      flex: none;
    }
    .user-name { font-family: Arial, sans-serif; font-size: .9rem; }
    .caret { color: var(--gold-light); font-size: .78rem; }

    .account-menu {
      position: fixed;
      z-index: 100;
      right: 1.25rem;
      top: calc(var(--header-h) - .25rem);
      width: min(280px, calc(100vw - 2rem));
      background: var(--ivory);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-2);
      padding: .55rem;
      animation: trayIn 220ms var(--ease-steeping);
    }
    .account-menu-meta {
      padding: .7rem .75rem .8rem;
      border-bottom: 1px solid var(--line);
      margin-bottom: .35rem;
    }
    .account-menu-meta small {
      display: block;
      color: var(--fog);
      font-family: Arial, sans-serif;
    }
    .account-menu-meta strong {
      font-family: Arial, sans-serif;
      font-size: .9rem;
      overflow-wrap: anywhere;
    }
    .account-menu a, .account-menu button {
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--ink);
      text-decoration: none;
      padding: .7rem .75rem;
      border-radius: var(--radius-sm);
      display: block;
      text-align: left;
      cursor: pointer;
      font-family: Arial, sans-serif;
      font-size: .9rem;
    }
    .account-menu a:hover, .account-menu button:hover { background: rgba(75,22,56,.07); }
    .menu-divider { border-top: 1px solid var(--line); margin: .35rem 0; }

    .sidebar {
      position: fixed;
      z-index: 40;
      top: var(--header-h);
      bottom: 0;
      left: 0;
      width: var(--sidebar-w);
      background: linear-gradient(180deg, var(--plum), var(--plum-aged));
      color: var(--ivory);
      padding: 1.1rem .8rem 2rem;
      overflow-y: auto;
    }
    .primary-nav { display: grid; gap: .32rem; }
    .nav-link {
      position: relative;
      min-height: 50px;
      display: flex;
      align-items: center;
      gap: .9rem;
      padding: .65rem .9rem;
      border-radius: var(--radius-md);
      text-decoration: none;
      color: rgba(251,247,236,.8);
      font-family: Arial, sans-serif;
      font-weight: 700;
      font-size: .9rem;
      transition: background 220ms var(--ease-steeping), color 220ms var(--ease-steeping), transform 220ms var(--ease-steeping);
    }
    .nav-link:hover { background: rgba(255,255,255,.07); color: var(--white); transform: translateX(2px); }
    .nav-link.active {
      color: var(--white);
      background: rgba(255,255,255,.1);
    }
    .nav-link.active::before {
      content: "";
      position: absolute;
      left: -.8rem;
      top: .52rem;
      bottom: .52rem;
      width: 4px;
      border-radius: 0 4px 4px 0;
      background: var(--gold);
      box-shadow: 0 0 14px rgba(201,162,39,.42);
    }
    .nav-icon {
      width: 24px;
      text-align: center;
      color: var(--gold-light);
      font-size: 1.1rem;
      flex: none;
    }
    .sidebar-note {
      margin: 2rem .9rem 0;
      padding-top: 1rem;
      border-top: 1px solid rgba(224,190,107,.22);
      color: rgba(251,247,236,.68);
      font: .78rem/1.5 Arial, sans-serif;
    }

    .mobile-nav { display: none; }

    .main-shell {
      min-height: 100vh;
      padding: calc(var(--header-h) + 2rem) 1.5rem 3rem calc(var(--sidebar-w) + 1.5rem);
    }
    .page {
      width: min(100%, var(--content-max));
      margin: 0 auto;
      animation: trayIn 260ms var(--ease-steeping);
    }
    @keyframes trayIn {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .page-heading {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .page-title {
      margin: 0;
      color: var(--plum);
      font-size: clamp(2rem, 3vw, 3.25rem);
      line-height: 1.05;
      letter-spacing: -.035em;
      text-wrap: balance;
    }
    .page-lede {
      margin: .55rem 0 0;
      color: var(--walnut);
      max-width: 68ch;
      font-size: 1.04rem;
    }
    .eyebrow, .section-label {
      color: var(--plum);
      font: 800 .73rem/1.2 Arial, sans-serif;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .section-label {
      display: flex;
      align-items: center;
      gap: .8rem;
      margin: 2rem 0 .85rem;
    }
    .section-label::after {
      content: "";
      height: 1px;
      flex: 1;
      background: linear-gradient(90deg, var(--line-strong), transparent);
    }

    .card {
      background: rgba(251,247,236,.92);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-1);
      padding: 1.25rem;
    }
    .card + .card { margin-top: 1rem; }
    .card-title { margin: 0; color: var(--plum); font-size: 1.35rem; line-height: 1.2; }
    .card-meta {
      margin: .4rem 0 0;
      color: var(--fog);
      font-family: Arial, sans-serif;
      font-size: .88rem;
    }
    .card-footer {
      margin-top: 1.15rem;
      padding-top: 1rem;
      border-top: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .75rem;
      flex-wrap: wrap;
    }

    .hero-welcome {
      border-left: 5px solid var(--gold);
      background:
        linear-gradient(125deg, rgba(255,255,255,.48), rgba(255,255,255,.12)),
        var(--ivory);
      padding: 1.55rem 1.65rem;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-1);
      border-top: 1px solid var(--line);
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }
    .hero-welcome h1 {
      margin: 0;
      color: var(--plum);
      font-size: clamp(2.1rem, 4vw, 3.8rem);
      line-height: 1;
      letter-spacing: -.045em;
    }
    .hero-welcome p {
      margin: .7rem 0 0;
      color: var(--walnut);
      font-size: clamp(1rem, 1.7vw, 1.25rem);
      max-width: 760px;
    }

    .btn {
      min-height: 44px;
      border: 1px solid transparent;
      border-radius: var(--radius-md);
      padding: .68rem 1rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .45rem;
      text-decoration: none;
      cursor: pointer;
      font: 800 .86rem/1.15 Arial, sans-serif;
      letter-spacing: .01em;
      transition: transform 180ms var(--ease-steeping), background 180ms var(--ease-steeping), border-color 180ms var(--ease-steeping), box-shadow 180ms var(--ease-steeping);
    }
    .btn:hover { transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn-primary { background: var(--sage); color: var(--white); border-color: var(--sage); }
    .btn-primary:hover { background: var(--forest); border-color: var(--forest); box-shadow: 0 6px 16px rgba(63,78,54,.18); }
    .btn-secondary { background: transparent; color: var(--plum); border-color: rgba(75,22,56,.35); }
    .btn-secondary:hover { background: rgba(75,22,56,.06); border-color: var(--plum); }
    .btn-gold { background: var(--gold); color: var(--plum-aged); border-color: var(--gold); }
    .btn-gold:hover { background: var(--gold-light); }
    .btn-danger { background: var(--danger); color: var(--white); border-color: var(--danger); }
    .btn-danger:hover { background: var(--danger-dark); border-color: var(--danger-dark); }
    .btn-quiet { border-color: transparent; background: transparent; color: var(--plum); padding-inline: .35rem; }
    .btn-quiet:hover { background: rgba(75,22,56,.06); }
    .btn[disabled], .btn[aria-disabled="true"] {
      cursor: not-allowed;
      opacity: .55;
      transform: none;
      box-shadow: none;
    }
    .button-row { display: flex; gap: .65rem; flex-wrap: wrap; align-items: center; }

    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 27px;
      padding: .27rem .65rem;
      border-radius: 999px;
      font: 700 .72rem/1 Arial, sans-serif;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.5);
      color: var(--walnut);
      white-space: nowrap;
    }
    .chip.success { color: var(--forest); background: rgba(124,139,94,.13); border-color: rgba(63,78,54,.25); }
    .chip.gold { color: var(--plum-aged); background: rgba(201,162,39,.15); border-color: rgba(201,162,39,.5); }
    .chip.warning { color: #6B4A00; background: rgba(224,190,107,.18); border-color: rgba(201,162,39,.42); }
    .chip.neutral { color: var(--fog); }
    .chip.danger { color: var(--danger-dark); background: rgba(139,47,60,.08); border-color: rgba(139,47,60,.26); }

    .muted { color: var(--fog); }
    .privacy-line {
      color: var(--fog);
      font-family: Arial, sans-serif;
      font-size: .84rem;
      margin: 1.45rem 0 0;
    }
    .privacy-line::before { content: "◌"; color: var(--gold); margin-right: .4rem; }

    .next-card {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 1rem;
      align-items: start;
    }
    .next-card .instructions {
      margin: 1rem 0 0;
      padding: .85rem 1rem;
      border-left: 3px solid var(--sage);
      background: rgba(124,139,94,.08);
      color: var(--forest);
    }
    .event-facts { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: .75rem; }
    .mini-teas {
      display: grid;
      grid-template-columns: repeat(4, minmax(90px, 1fr));
      gap: .65rem;
      margin-top: 1rem;
    }
    .mini-tea {
      min-height: 88px;
      background: linear-gradient(145deg, var(--cream), var(--ivory));
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: .7rem;
      display: grid;
      align-content: space-between;
    }
    .mini-tea strong { color: var(--plum); font-size: .94rem; }
    .stars { color: #9B7610; letter-spacing: .04em; white-space: nowrap; }
    .stats-row {
      display: flex;
      flex-wrap: wrap;
      gap: .55rem 1.25rem;
      margin-top: .95rem;
      color: var(--walnut);
      font-family: Arial, sans-serif;
      font-size: .88rem;
    }
    .stat strong { color: var(--plum); }

    .horizontal-strip {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(170px, 1fr);
      gap: .8rem;
      overflow-x: auto;
      padding: .2rem .1rem .8rem;
      scroll-snap-type: x proximity;
      scrollbar-color: var(--gold) transparent;
    }
    .horizontal-strip > * { scroll-snap-align: start; }

    .saved-mini {
      min-height: 188px;
      display: flex;
      flex-direction: column;
    }
    .saved-mini .btn { margin-top: auto; align-self: flex-start; }
    .saved-mini p { margin: .55rem 0 .8rem; }

    .stamp-strip {
      grid-auto-columns: 128px;
    }
    .stamp {
      min-height: 145px;
      padding: .85rem .65rem;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(224,190,107,.56);
      background:
        radial-gradient(circle at 50% 20%, rgba(224,190,107,.12), transparent 48%),
        var(--plum-aged);
      color: var(--ivory);
      text-decoration: none;
      display: grid;
      place-items: center;
      text-align: center;
      box-shadow: 0 8px 18px rgba(51,16,42,.17);
      transition: transform 220ms var(--ease-steeping), border-color 220ms var(--ease-steeping);
    }
    .stamp:hover { transform: translateY(-3px); border-color: var(--gold-light); }
    .stamp-symbol { color: var(--gold-light); font-size: 1.55rem; line-height: 1; }
    .stamp strong { font-size: .87rem; line-height: 1.15; }
    .stamp small { color: rgba(251,247,236,.68); font: .7rem/1.2 Arial, sans-serif; }
    .stamp.ghost {
      background: transparent;
      border: 2px dashed rgba(140,133,120,.55);
      box-shadow: none;
      min-height: 145px;
    }

    .toolbar {
      display: flex;
      gap: .65rem;
      align-items: flex-end;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }
    .field { display: grid; gap: .38rem; }
    .field.grow { flex: 1 1 260px; }
    .field label {
      color: var(--walnut);
      font: 700 .77rem/1.2 Arial, sans-serif;
    }
    .input, .select, .textarea {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-md);
      background: var(--ivory);
      color: var(--ink);
      padding: .7rem .8rem;
    }
    .textarea { min-height: 118px; resize: vertical; }
    .input:focus, .select:focus, .textarea:focus {
      border-color: var(--gold);
      outline: 3px solid rgba(201,162,39,.22);
    }
    .help { color: var(--fog); font: .78rem/1.4 Arial, sans-serif; }

    .journal-list { display: grid; gap: 1rem; }
    .journal-card { padding: 0; overflow: hidden; }
    .journal-card-head {
      padding: 1.2rem 1.25rem .95rem;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(100deg, rgba(75,22,56,.045), transparent);
    }
    .journal-card-body { padding: 1.1rem 1.25rem 1.2rem; }
    .tea-table { width: 100%; border-collapse: collapse; }
    .tea-table th, .tea-table td {
      padding: .55rem .35rem;
      border-bottom: 1px solid rgba(74,53,36,.11);
      text-align: left;
      vertical-align: top;
    }
    .tea-table th {
      font: 800 .71rem/1.2 Arial, sans-serif;
      letter-spacing: .09em;
      text-transform: uppercase;
      color: var(--fog);
    }
    .tea-table tr:last-child td { border-bottom: 0; }
    .empty-state {
      text-align: center;
      padding: clamp(2rem, 6vw, 4.5rem) 1.25rem;
      border: 1px dashed var(--line-strong);
      border-radius: var(--radius-md);
      background: rgba(251,247,236,.55);
    }
    .empty-state .empty-visual {
      width: 150px;
      height: 90px;
      border: 2px dashed rgba(140,133,120,.55);
      border-radius: var(--radius-md);
      margin: 0 auto 1.2rem;
      display: grid;
      place-items: center;
      color: var(--fog);
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      margin-bottom: 1.1rem;
      color: var(--plum);
      font: 800 .84rem/1.2 Arial, sans-serif;
      text-decoration: none;
    }
    .back-link:hover { text-decoration: underline; }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: .75rem;
      margin: 1rem 0 1.4rem;
    }
    .summary-item {
      background: rgba(251,247,236,.72);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: .9rem;
    }
    .summary-item span { display: block; color: var(--fog); font: .74rem/1.2 Arial, sans-serif; }
    .summary-item strong { display: block; margin-top: .35rem; color: var(--plum); font-size: 1.15rem; }

    .flight-list { display: grid; gap: 1rem; }
    .flight-card {
      position: relative;
      padding-left: 4rem;
    }
    .flight-number {
      position: absolute;
      left: 1rem;
      top: 1.1rem;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--plum);
      color: var(--gold-light);
      font: 800 .9rem/1 Arial, sans-serif;
    }
    .quote {
      margin: 1rem 0;
      padding: .8rem 1rem;
      border-left: 3px solid var(--gold);
      background: rgba(201,162,39,.075);
      color: var(--walnut);
      font-style: italic;
    }
    .descriptor-row { display: flex; flex-wrap: wrap; gap: .4rem; }
    .descriptor {
      border-radius: 999px;
      background: rgba(75,22,56,.08);
      color: var(--plum);
      border: 1px solid rgba(75,22,56,.16);
      padding: .28rem .62rem;
      font: 700 .73rem/1.15 Arial, sans-serif;
    }

    .tea-hero {
      background:
        radial-gradient(circle at 88% 8%, rgba(224,190,107,.18), transparent 15rem),
        linear-gradient(120deg, rgba(75,22,56,.055), transparent 62%),
        var(--ivory);
    }
    .record-grid {
      display: grid;
      grid-template-columns: 1.45fr .8fr;
      gap: 1rem;
      align-items: start;
    }
    .detail-list { margin: 0; display: grid; gap: .8rem; }
    .detail-list > div {
      display: grid;
      grid-template-columns: 140px 1fr;
      gap: .8rem;
      padding-bottom: .75rem;
      border-bottom: 1px solid rgba(74,53,36,.12);
    }
    .detail-list > div:last-child { border-bottom: 0; padding-bottom: 0; }
    .detail-list dt { color: var(--fog); font: 800 .74rem/1.35 Arial, sans-serif; }
    .detail-list dd { margin: 0; }
    .intensity-scale {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: .45rem;
      margin-top: .5rem;
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(storageKey);
        if (!raw) return structuredClone(defaultState);
        const parsed = JSON.parse(raw);
        return {
          ...structuredClone(defaultState),
          ...parsed,
          user: {...defaultState.user, ...(parsed.user || {})},
          settings: {...defaultState.settings, ...(parsed.settings || {})},
          journal: {...defaultState.journal, ...(parsed.journal || {})},
          claim: {...defaultState.claim, ...(parsed.claim || {})}
        };
      } catch {
        return structuredClone(defaultState);
      }

    function saveState() {
      localStorage.setItem(storageKey, JSON.stringify(state));
      applyMotionSetting();

    function applyMotionSetting() {
      const reduce = state.settings.reducedMotion === "on" ||
        (state.settings.reducedMotion === "device" && matchMedia("(prefers-reduced-motion: reduce)").matches);
      document.documentElement.classList.toggle("force-reduced-motion", reduce);
    }

    function route() {
      return (location.hash.slice(1) || "/dashboard").split("?")[0];
    }

    function navigate(path) {
      if (route() === path) {
        render();
      } else {
        location.hash = path;
      }
    }

    function isUtilityRoute(path) {
      return /^\/dashboard\/(login|create|claim|verify|recover)/.test(path);
    }

      {label:"Home", icon:"⌂", path:"/dashboard"},

      {label:"Saved Teas", short:"Saved", icon:"♡", path:"/dashboard/saved"},
      {label:"Upcoming", icon:"▦", path:"/dashboard/events"}
    ];

    function navIsActive(itemPath, current) {
      if (itemPath === "/dashboard") return current === "/dashboard";
      return current.startsWith(itemPath);
    }

    function renderChrome(current) {
      const utility = isUtilityRoute(current);
      $("#sidebar").hidden = utility;
      $("#mobile-nav").hidden = utility;
      document.body.style.paddingBottom = utility ? "0" : "";

      $("#header-actions").innerHTML = utility ? "" : `
        <button class="header-user" type="button" data-action="toggle-account-menu" aria-haspopup="menu" aria-expanded="false">

        $("#sidebar").innerHTML = `
          <nav class="primary-nav">
            ${navItems.map(item => `
              <a class="nav-link ${navIsActive(item.path, current) ? "active" : ""}" href="#${item.path}" ${navIsActive(item.path, current) ? 'aria-current="page"' : ""}>
                <span class="nav-icon" aria-hidden="true">${item.icon}</span>
                <span>${item.label}</span>
              </a>`).join("")}
          </nav>
          <p class="sidebar-note">Your tasting notes are private. Hosts see attendance and room-level aggregates, never the words you wrote.</p>`;

        $("#mobile-nav").innerHTML = navItems.map(item => `
          <a class="${navIsActive(item.path, current) ? "active" : ""}" href="#${item.path}" ${navIsActive(item.path, current) ? 'aria-current="page"' : ""}>
            <span aria-hidden="true">${item.icon}</span><span>${item.short || item.label}</span>

      $(".main-shell").classList.toggle("auth-shell", utility);

    function render() {
      $("[data-account-menu]")?.remove();
      const current = route();
      showLoader();
      renderChrome(current);
      const view = $("#view");
      view.className = "page";

      let html = "";
      if (current === "/dashboard") html = homeView();
      else if (current === "/dashboard/tastings") html = tastingsView();
      else if (/^\/dashboard\/tastings\/[^/]+\/tea\/[^/]+$/.test(current)) {
        const [, eventId, teaId] = current.match(/^\/dashboard\/tastings\/([^/]+)\/tea\/([^/]+)$/);
        html = teaRecordView(eventId, teaId);
      }
      else if (/^\/dashboard\/tastings\/[^/]+$/.test(current)) {
        const eventId = current.split("/").pop();
        html = tastingRecapView(eventId);
      }
      else if (current === "/dashboard/passport") html = passportView();
      else if (/^\/dashboard\/passport\/[^/]+$/.test(current)) html = stampDetailView(current.split("/").pop());
      else if (current === "/dashboard/saved") html = savedView();
      else if (/^\/dashboard\/saved\/[^/]+$/.test(current)) html = savedTeaView(current.split("/").pop());
      else if (current === "/dashboard/events") html = upcomingView();
      else if (/^\/dashboard\/events\/[^/]+$/.test(current)) html = upcomingDetailView(current.split("/").pop());
      else if (current === "/dashboard/account") html = accountView("details");
      else if (/^\/dashboard\/account\/[^/]+$/.test(current)) html = accountView(current.split("/").pop());
      else if (current === "/dashboard/login") html = loginView();
      else if (current === "/dashboard/create") html = createView();
      else if (current.startsWith("/dashboard/claim/expired")) html = expiredClaimView();
      else if (current.startsWith("/dashboard/claim/")) html = claimView();
      else if (current === "/dashboard/verify/pending") html = verifyPendingView();
      else if (current.startsWith("/dashboard/verify/")) html = verifyResultView();
      else if (current === "/dashboard/recover") html = recoveryView();
      else html = notFoundView();

      view.innerHTML = html;
      bindViewInputs();
      requestAnimationFrame(() => {
        $("#main-content").focus({preventScroll:true});
        window.scrollTo({top:0, behavior:"instant"});
      });
    }

      `;

    function getFilteredEvents() {
      const q = state.journal.search.trim().toLowerCase();
      let list = events.filter(e => !state.deletedEvents.includes(e.id));
      if (state.journal.year !== "all") list = list.filter(e => e.date.startsWith(state.journal.year));
      if (state.journal.type !== "all") list = list.filter(e => e.type === state.journal.type);
      if (q) {
        list = list.filter(e => {
          const hay = [e.name, e.joinedAs, ...e.teaIds.flatMap(id => {
            const t = teas[id];
            return [t.name, t.first, t.notes, ...t.descriptors];
          })].join(" ").toLowerCase();
          return hay.includes(q);
        });
      }
      if (state.journal.sort === "oldest") list.sort((a,b) => a.date.localeCompare(b.date));
      else if (state.journal.sort === "highest") list.sort((a,b) => b.average - a.average);
      else list.sort((a,b) => b.date.localeCompare(a.date));
      return list;
    }

    function teaRecordView(eventId, teaId) {
      const event = events.find(e => e.id === eventId);

      const isSaved = state.saved.includes(tea.id);
      const position = event.teaIds.indexOf(tea.id) + 1;

          <p class="page-lede">${esc(tea.origin)} · Producer: ${esc(tea.producer)} · Poured ${ordinal(position)} · steeped ${30 + ((position-1)*5)} seconds</p>
          <div class="button-row" style="margin-top:1rem"><span class="chip ${isSaved?"success":"neutral"}">${isSaved?"Saved to remember":"Not saved"}</span>${availabilityChip(tea)}</div>

                <div><dt>Aroma</dt><dd><div class="descriptor-row">${tea.descriptors.map(x=>`<span class="descriptor">${esc(x)}</span>`).join("")}</div></dd></div>
                <div><dt>Intensity, overall</dt><dd><div class="intensity-scale">${["subtle","clear","dominant"].map(x=>`<span class="${tea.intensity===x?"active":""}">${x}</span>`).join("")}</div></dd></div>

                <div><dt>Your notes</dt><dd>${tea.notes ? esc(tea.notes) : `<span class="muted">You didn’t leave a note on this one that evening.</span>`}<p class="help">Private to you. Historical notes are read-only in this dashboard version.</p></dd></div>

            </section>

              <h2 class="card-title">What the host told the room</h2>
              <p>“${esc(tea.reveal)}”</p>
              <p class="card-meta">That night: ${30 + ((position-1)*5)}s, 95°C</p>
            </section>

            <section class="card">
              <h2 class="card-title">Trivia</h2>
              ${tea.triviaCorrect === null
                ? `<p>No trivia question on this pour.</p>`

              ${occurrences.map(e => `<p class="card-meta">${shortDate(e.date)} · ${stars(tea.rating)} · <a href="#/dashboard/tastings/${e.id}">${esc(e.name)}</a></p>`).join("")}

            </section>
          </aside>
        </div>
        ${footerNote()}
      `;

    function ordinal(n) {
      return ["first","second","third","fourth","fifth","sixth"][n-1] || `${n}th`;
    }

    function stampCard(tea) {
      return `<a class="stamp" href="#/dashboard/passport/${tea.id}" aria-label="Open ${esc(tea.name)} Passport stamp">
        <span class="stamp-symbol" aria-hidden="true">✦</span>
        <strong>${esc(tea.name)}</strong>
        <small>${esc(tea.region)}<br>${tea.saveDate ? shortDate(tea.saveDate) : "Tasted 2026"}</small>
      </a>`;
    }

    function passportView() {
      const stamps = Object.values(teas).filter(t => t.stamped);
      const groups = groupStamps(stamps, state.passportGroup);
      return `
        ${pageHeading("Your Passport", "Sixteen stamps, four regions, three evenings.")}
        <div class="toolbar" role="group" aria-label="Group Passport stamps">
          ${["region","category","evening"].map(group => `<button class="btn ${state.passportGroup===group?"btn-primary":"btn-secondary"}" type="button" data-action="passport-group" data-group="${group}">By ${group}</button>`).join("")}
        </div>
        ${Object.entries(groups).map(([name, list]) => `
          <section class="card passport-region">
            <div class="region-head"><h2>${esc(name)}</h2><span>${list.length} of the ${list.length + (state.passportGroup==="region" ? Math.min(3, list.length) : 0)} you’ve been offered</span></div>
            <div class="stamp-grid">${list.map(stampCard).join("")}${state.passportGroup==="region" ? Array.from({length:Math.min(3,list.length)},()=>`<div class="stamp ghost" aria-label="Uncollected tea offered in an attended event"></div>`).join("") : ""}</div>
          </section>`).join("")}
        <div class="notice">Passport progress is shown only against teas you were actually offered. There are no streaks, countdowns or catalogue-wide completion pressure.</div>
        ${footerNote()}
      `;
    }

    function groupStamps(stamps, group) {
      const out = {};
      if (group === "category") {
        stamps.forEach(t => (out[t.category] ||= []).push(t));
      } else if (group === "evening") {
        events.filter(e => !state.deletedEvents.includes(e.id)).forEach(e => {
          out[e.name] = e.teaIds.map(id => teas[id]).filter(Boolean);
        });
      } else {
        stamps.forEach(t => (out[t.region] ||= []).push(t));
      }
      return out;
    }

    function savedView() {
      const filter = state.savedFilter;
      let list = state.saved.map(id => teas[id]).filter(Boolean);
      if (filter === "available") list = list.filter(t => ["available","replaced"].includes(t.available));

      return `

          ${list.length ? list.map(savedRow).join("") : `<div class="empty-state"><div class="empty-visual">♡</div><h2>Nothing matches this filter.</h2><button class="btn btn-secondary" data-action="saved-filter" data-filter="all">Show All Saved Teas</button></div>`}
        </div>

      if (section === "communication") return communicationSettings();

        <h3 class="section-label"><span>Linked to this account</span></h3>
        ${events.filter(e=>!state.deletedEvents.includes(e.id)).map(e=>`<div class="setting-row"><div><strong>${esc(e.name)}</strong><p>${shortDate(e.date)} · joined as “${esc(e.joinedAs)}”</p></div><span class="chip success">Linked</span></div>`).join("")}
        <h3 class="section-label"><span>Other evenings under the verified email</span></h3>
        <p class="help">Additional matches are offered unselected. Unchecked records stay anonymous and keep their existing retention deadline.</p>
        <div class="linked-list">${candidates.map(c=>`<label class="linked-item"><input type="checkbox" value="${c.id}" data-claim-match ${state.claim.selectedMatches.includes(c.id)?"checked":""}><span><strong>${esc(c.event)}</strong><span class="help">${shortDate(c.date)} · ${esc(c.type)} · joined as “${esc(c.joined)}” · ${c.count} teas · ${c.stamps} stamps · ${c.saved} saved</span></span><span class="chip warning">Retains until ${shortDate(c.expires)}</span></label>`).join("")}</div>
        <div class="button-row" style="margin-top:1rem"><button class="btn btn-primary" data-action="link-selected">Add Selected Evenings</button><a class="btn btn-secondary" href="#/dashboard/claim/demo-token">Open Claim Demo</a></div>
        <div class="notice">For an evening recorded under another address, open that evening’s signed claim link while signed in. Ownership confirmation goes only to the email stored on that participant row.</div>
      </section>`;
    }

    function deleteSettings() {
      return `<section class="card settings-card">
        <h2>Delete account / customer data</h2>
        <div class="notice danger">This removes customer-facing data. In production, a staff- or host-bearing account must use a protected customer-data-only path so staff roles, event access and host-control dependencies are not removed.</div>
        <p>A standard customer deletion removes the customer account and linked customer records, subject to the product’s required historical reporting boundaries. Marketing consent is handled independently by the marketing provider.</p>
        <div class="field"><label for="delete-confirm-text">Type DELETE to enable the final action</label><input class="input" id="delete-confirm-text" autocomplete="off"></div>
        <button class="btn btn-danger" type="button" data-action="delete-account" disabled>Delete Account / Customer Data</button>
      </section>`;
    }

    function switchRow(key, title, copy) {
      return `<div class="setting-row"><div><strong>${esc(title)}</strong><p>${esc(copy)}</p></div><label class="switch"><span class="sr-only"></span><input type="checkbox" data-setting="${key}" ${state.settings[key]?"checked":""} aria-label="${esc(title)}"><span aria-hidden="true"></span></label></div>`;
    }

    function authWrap(title, lede, body) {
      return `<section class="auth-panel"><p class="eyebrow">Vintage Fork Customer Dashboard</p><h1>${title}</h1><p class="lede">${lede}</p>${body}</section>`;
    }

    function loginView() {
      return authWrap("Welcome back", "Your cellar is where you left it.", `
        <form data-form="login">
          <div class="field"><label for="login-email">Email</label><input class="input" id="login-email" type="email" value="${esc(state.user.email)}" required autocomplete="email"></div>
          <div class="field"><label for="login-password">Password</label><input class="input" id="login-password" type="password" value="prototype" required autocomplete="current-password"></div>
          <button class="btn btn-primary" type="submit">Sign In</button>
        </form>
        <p><a href="#/dashboard/recover">Forgot your password?</a></p>
        <div class="auth-separator">or</div>
        <p>Have a recap email? Open its claim link to keep that evening.</p>
        <a class="btn btn-secondary" href="#/dashboard/claim/demo-token">Preview Claim Journey</a>
        <p class="help">Prototype note: any non-empty password signs in.</p>
      `);
    }

    function createView() {
      return authWrap("Start your cellar", "A place for the teas you’ve tasted and the ones you want to remember.", `
        <form data-form="create">
          <div class="field"><label for="create-name">Your name</label><input class="input" id="create-name" required value="${esc(state.user.name)}" autocomplete="name"></div>
          <div class="field"><label for="create-email">Email</label><input class="input" id="create-email" type="email" required value="${esc(state.user.email)}" autocomplete="email"></div>
          <div class="field"><label for="create-password">Password</label><input class="input" id="create-password" type="password" required minlength="6" autocomplete="new-password"></div>
          <label style="display:flex;gap:.65rem;align-items:flex-start;margin-top:1rem"><input type="checkbox" id="create-marketing" style="width:20px;height:20px;accent-color:var(--plum)"><span>Send me occasional notes about new teas and tastings. You can unsubscribe any time.</span></label>
          <button class="btn btn-primary" type="submit">Create My Account</button>
        </form>
        <p>Already have an account? <a href="#/dashboard/login">Sign in</a></p>
        <p class="help">After this address is verified, the system may offer unclaimed evenings recorded under the same exact normalised email.</p>
      `);
    }

    function claimView() {
      return authWrap("Keep your evening", "This claim is a continuation of the tasting, not a new account-management task.", `
        <div class="card" style="box-shadow:none">
          <div class="button-row"><h2 class="card-title">Autumn Oolong Flight</h2><span class="chip">In person</span></div>
          <p class="card-meta">Saturday 8 August 2026 · Hosted by Mei · You joined as “Amara”</p>
          <div class="claim-summary"><div><strong>4</strong><span>teas tasted</span></div><div><strong>4</strong><span>Passport stamps</span></div><div><strong>4</strong><span>sets of notes</span></div><div><strong>2</strong><span>teas saved</span></div></div>
        </div>
        <div class="field"><label>Confirmation address</label><input class="input" value="a•••a@e•••.com" disabled><span class="help">Locked. Confirmation is sent only to the email already stored on the participant record.</span></div>
        <form data-form="claim">
          <div class="field"><label for="claim-name">Your name</label><input class="input" id="claim-name" required value="${esc(state.user.name)}"></div>
          <div class="field"><label for="claim-password">Password</label><input class="input" id="claim-password" type="password" required minlength="6" value="prototype"></div>
          <button class="btn btn-primary" type="submit">Continue to Verification</button>
        </form>
        <p class="help">Nothing is linked until confirmation sent to the stored address is completed. The claim flow never edits that stored email.</p>
      `);
    }

    function verifyPendingView() {
      return authWrap("Check your email", "We sent a confirmation to a•••a@e•••.com.", `
        <div class="pending-mark" aria-label="Verification pending"></div>
        <p style="text-align:center"><strong>Nothing is linked yet.</strong></p>
        <button class="btn btn-secondary" style="width:100%" type="button" data-action="resend-verification">Send it again</button>
        <button class="btn btn-primary" style="width:100%;margin-top:.65rem" type="button" data-action="complete-verification">Simulate Email Confirmation</button>
        <p class="help">In production, the claim token is signed, participant-scoped, valid for 30 days and never longer than the anonymous record itself.</p>
      `);
    }

    function verifyResultView() {
      return authWrap(`Your cellar is open, ${esc(state.user.name)}.`, "The verified evening is now attached without moving or copying its child records.", `
        <div class="notice success"><strong>From Autumn Oolong Flight:</strong><br>4 teas in the order poured · your notes and ratings · 4 Passport stamps · 2 teas saved</div>
        <div class="button-row">
          <a class="btn btn-primary" href="#/dashboard/tastings/autumn-oolong">See That Evening</a>
          <a class="btn btn-secondary" href="#/dashboard">Go to My Cellar</a>
        </div>
        <div class="auth-separator">other matches</div>
        <p>Other unlinked rows under the same verified email are offered unselected. A household-shared email never causes silent linking.</p>
        <a class="btn btn-secondary" href="#/dashboard/account/linked">Review Other Evenings</a>
      `);
    }

    function expiredClaimView() {
      return authWrap("This claim link has expired", "The recovery shown depends on the underlying participant record.", `
        <div class="notice warning">The anonymous record still exists and has a stored email. A fresh link can be sent only to a•••a@e•••.com.</div>
        <button class="btn btn-primary" type="button" data-action="reissue-claim">Send a Fresh Claim Link</button>
        <p class="help">This screen never accepts a replacement address. If the record had already been deleted, the tasting would not be reconstructed.</p>
      `);
    }

    function recoveryView() {
      return authWrap("Recover your account", "Account recovery changes access only. It never changes tasting links.", `
        <form data-form="recover">
          <div class="field"><label for="recover-email">Email</label><input class="input" id="recover-email" type="email" required autocomplete="email"></div>
          <button class="btn btn-primary" type="submit">Send Reset Link</button>
        </form>
        <p class="help">The response is identical whether or not the account exists. Tasting history is never used as authentication.</p>
        <p><a href="#/dashboard/login">Return to sign in</a></p>
      `);
    }

    function missingRecord(message, href, label) {
      return `<div class="empty-state"><div class="empty-visual">record</div><h1>${esc(message)}</h1><p>The dashboard does not reconstruct deleted or unauthorised records.</p><a class="btn btn-primary" href="#${href}">${esc(label)}</a></div>`;
    }

    function notFoundView() {
      return `<div class="empty-state"><div class="empty-visual">404</div><h1>That page is not in your cellar.</h1><p>The route may be old, incomplete or outside this customer account.</p><a class="btn btn-primary" href="#/dashboard">Return Home</a></div>`;
    }

    function footerNote() {
      return `<p class="footer-note">Standalone front-end prototype · Data is local demo content · No cart, checkout, payment, inventory authority or live backend is included.</p>`;
    }

    function bindViewInputs() {
      $$("[data-state]").forEach(el => {
        const handler = () => {
          const [group,key] = el.dataset.state.split(".");
          state[group][key] = el.value;
          saveState();
          render();
        };
        el.addEventListener(el.type === "search" ? "input" : "change", debounce(handler, el.type === "search" ? 120 : 0));
      });
      $$("[data-setting]").forEach(el => el.addEventListener("change", () => {
        state.settings[el.dataset.setting] = el.checked;
        saveState();
        showToast(`${labelForSetting(el.dataset.setting)} ${el.checked ? "enabled" : "disabled"}.`);
      }));
      $$("[data-setting-select]").forEach(el => el.addEventListener("change", () => {
        state.settings[el.dataset.settingSelect] = el.value;
        saveState();
        showToast("Preference saved.");
      }));
      $$("[data-claim-match]").forEach(el => el.addEventListener("change", () => {
        const id = el.value;
        state.claim.selectedMatches = el.checked
          ? [...new Set([...state.claim.selectedMatches, id])]
          : state.claim.selectedMatches.filter(x => x !== id);
        saveState();
      }));
      const deleteText = $("#delete-confirm-text");
      if (deleteText) deleteText.addEventListener("input", () => {
        const btn = $("[data-action='delete-account']");
        btn.disabled = deleteText.value.trim() !== "DELETE";
      });
    }

    function labelForSetting(key) {
      return ({ambience:"Ambience",interfaceSounds:"Interface sounds",haptics:"Haptics",marketing:"Marketing messages",reminders:"Upcoming reminders",dashboardNotices:"Dashboard notices"})[key] || "Setting";
    }

    function debounce(fn, delay) {
      let t;
      return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), delay); };
    }

    function showToast(message, title = "Saved") {
      const el = document.createElement("div");
      el.className = "toast";
      el.innerHTML = `<strong>${esc(title)}</strong><br>${esc(message)}`;
      $("#toast-stack").append(el);
      setTimeout(() => el.remove(), 3400);
    }

    function successFeedback(message, title = "Saved") {
      showToast(message, title);
      playCeramicClink();
      if (state.settings.haptics && navigator.vibrate) navigator.vibrate(35);
    }

    function playCeramicClink() {
      if (!state.settings.interfaceSounds) return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;
        const gain = ctx.createGain();
        const osc1 = ctx.createOscillator();
        const osc2 = ctx.createOscillator();
        osc1.type = "sine"; osc2.type = "triangle";
        osc1.frequency.setValueAtTime(1180, now);
        osc2.frequency.setValueAtTime(1760, now);
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(0.055, now + .02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + .16);
        osc1.connect(gain); osc2.connect(gain); gain.connect(ctx.destination);
        osc1.start(now); osc2.start(now);
        osc1.stop(now + .18); osc2.stop(now + .18);
        setTimeout(() => ctx.close(), 240);
      } catch { /* Sound is always optional. */ }
    }

    function openDialog({title, copy, confirmLabel = "Confirm", danger = true, onConfirm}) {
      $("#dialog-title").textContent = title;
      $("#dialog-copy").innerHTML = copy;
      const confirm = $("#dialog-confirm");
      confirm.textContent = confirmLabel;
      confirm.className = `btn ${danger ? "btn-danger" : "btn-primary"}`;
      pendingDialogAction = onConfirm;
      $("#confirm-dialog").showModal();
    }

    function closeDialog() {
      $("#confirm-dialog").close();
      pendingDialogAction = null;
    }

    document.addEventListener("click", event => {
      const actionEl = event.target.closest("[data-action]");
      const accountMenuEl = event.target.closest("[data-account-menu]");
      const userButton = event.target.closest("[data-action='toggle-account-menu']");

      if (!accountMenuEl && !userButton) {
        $("[data-account-menu]")?.remove();
        const button = $("[data-action='toggle-account-menu']");
        if (button) button.setAttribute("aria-expanded","false");
      }

      if (!actionEl) return;
      const action = actionEl.dataset.action;

      if (action === "toggle-account-menu") {
        const existing = $("[data-account-menu]");
        if (existing) {
          existing.remove();
          actionEl.setAttribute("aria-expanded","false");
        } else {
          document.body.insertAdjacentHTML("beforeend", accountMenu());
          actionEl.setAttribute("aria-expanded","true");
          $("[data-account-menu] a, [data-account-menu] button")?.focus();
        }
      }

      if (action === "sign-out") {
        $("[data-account-menu]")?.remove();
        navigate("/dashboard/login");
        showToast("You have been signed out of the prototype.", "Signed out");
      }

      if (action === "toggle-save") {
        const id = actionEl.dataset.teaId;
        const tea = teas[id];
        if (!tea) return;
        if (state.saved.includes(id)) {
          openDialog({
            title: `Remove ${tea.name} from Saved?`,
            copy: `<p>This removes the bookmark only. The tasting record and Passport stamp stay intact.</p>`,
            confirmLabel: "Remove from Saved",
            onConfirm: () => {
              state.saved = state.saved.filter(x => x !== id);
              saveState();
              closeDialog();
              render();
              successFeedback(`${tea.name} was removed from Saved to Remember.`, "Bookmark removed");
            }
          });
        } else {
          state.saved.push(id);
          saveState();
          render();
          successFeedback(`${tea.name} is now saved to remember. This did not add it to a cart.`, "Tea saved");
        }
      }

      if (action === "passport-group") {
        state.passportGroup = actionEl.dataset.group;
        saveState();
        render();
      }

      if (action === "saved-filter") {
        state.savedFilter = actionEl.dataset.filter;
        saveState();
        render();
      }

      if (action === "clear-journal-filters") {
        state.journal = structuredClone(defaultState.journal);
        saveState();
        render();
      }

      if (action === "delete-tasting") {
        const eventId = actionEl.dataset.eventId;
        const tasting = events.find(e => e.id === eventId);
        openDialog({
          title: `Delete ${tasting.name}?`,
          copy: `<p>This removes this participation and its notes, trivia responses, Passport stamps and saves from the prototype. It does not delete the account.</p><p><strong>This cannot be undone in the demo.</strong></p>`,
          confirmLabel: "Delete This Tasting",
          onConfirm: () => {
            state.deletedEvents = [...new Set([...state.deletedEvents, eventId])];
            tasting.teaIds.forEach(id => {
              const appearsElsewhere = events.some(e => e.id !== eventId && !state.deletedEvents.includes(e.id) && e.teaIds.includes(id));
              if (!appearsElsewhere) state.saved = state.saved.filter(x => x !== id);
            });
            saveState();
            closeDialog();
            navigate("/dashboard/tastings");
            showToast("The tasting was removed from this prototype.", "Tasting deleted");
          }
        });
      }

      if (action === "save-account-name") {
        const input = $("#account-name");
        if (!input || !input.value.trim()) return;
        state.user.name = input.value.trim();
        saveState();
        render();
        successFeedback("Your dashboard greeting name was updated. Past tasting display names did not change.");
      }

      if (action === "change-email") {
        openDialog({
          title: "Change sign-in email",
          copy: `<p>This prototype does not send email. In production, the new primary sign-in email must be verified and no tasting participation email is rewritten or re-matched automatically.</p>`,
          confirmLabel: "Understood",
          danger: false,
          onConfirm: closeDialog
        });
      }

      if (action === "change-password") {
        successFeedback("Password-change flow previewed. No password is stored by this standalone prototype.", "Security");
      }

      if (action === "download-data") downloadData();

      if (action === "link-selected") {
        const count = state.claim.selectedMatches.length;
        if (!count) {
          showToast("Select at least one evening. Matches are never linked silently.", "Nothing selected");
          return;
        }
        state.claim.selectedMatches = [];
        saveState();
        successFeedback(`${count} selected evening${count===1?"":"s"} linked in the prototype after explicit confirmation.`, "Evenings linked");
        render();
      }

      if (action === "delete-account") {
        openDialog({
          title: "Delete account / customer data?",
          copy: `<p>This resets all customer-facing demo data on this device. A production staff-bearing account would use a protected customer-data-only path.</p>`,
          confirmLabel: "Delete Demo Customer Data",
          onConfirm: () => {
            localStorage.removeItem(storageKey);
            state = structuredClone(defaultState);
            closeDialog();
            navigate("/dashboard/login");
            showToast("Local prototype data was cleared.", "Customer data deleted");
          }
        });
      }

      if (action === "resend-verification") {
        successFeedback("A new confirmation was simulated to the same locked participant email.", "Verification resent");
      }
      if (action === "complete-verification") navigate("/dashboard/verify/demo-confirmed");
      if (action === "reissue-claim") {
        successFeedback("A fresh claim link was simulated to the masked stored address.", "Claim reissued");
        navigate("/dashboard/verify/pending");
      }
    });

    document.addEventListener("submit", event => {
      const form = event.target.closest("form[data-form]");
      if (!form) return;
      event.preventDefault();
      const type = form.dataset.form;
      if (!form.reportValidity()) return;
      if (type === "login") {
        successFeedback("Your cellar is open.", "Signed in");
        navigate("/dashboard");
      }
      if (type === "create") {
        state.user.name = $("#create-name").value.trim();
        state.user.email = $("#create-email").value.trim();
        state.settings.marketing = $("#create-marketing").checked;
        saveState();
        successFeedback("Account created. Email verification is represented by the next screen.", "Account created");
        navigate("/dashboard/verify/pending");
      }
      if (type === "claim") {
        state.user.name = $("#claim-name").value.trim();
        saveState();
        successFeedback("Ownership confirmation was sent to the locked participant email.", "Check your email");
        navigate("/dashboard/verify/pending");
      }
      if (type === "recover") {
        showToast("If there is an account for that address, a reset link is on its way.", "Check your email");
      }
    });

    $("#confirm-dialog").addEventListener("click", event => {
      if (event.target === $("#confirm-dialog")) closeDialog();
    });
    $("[data-dialog-cancel]").addEventListener("click", closeDialog);
    $("#dialog-confirm").addEventListener("click", () => pendingDialogAction?.());

    window.addEventListener("hashchange", render);
    window.addEventListener("storage", () => { state = loadState(); render(); });
    matchMedia("(prefers-reduced-motion: reduce)").addEventListener?.("change", applyMotionSetting);

    function downloadData() {
      const payload = {
        generated_at: new Date().toISOString(),
        account: state.user,
        preferences: state.settings,
        linked_tastings: events.filter(e => !state.deletedEvents.includes(e.id)),
        tasting_notes: Object.values(teas).map(t => ({tea_id:t.id, tea_name:t.name, first_impression:t.first, descriptors:t.descriptors, intensity:t.intensity, rating:t.rating, notes:t.notes})),
        passport_stamps: Object.values(teas).filter(t => t.stamped).map(t => ({tea_id:t.id, tea_name:t.name, origin:t.origin})),
        saved_teas: state.saved.map(id => teas[id]).filter(Boolean).map(t => ({tea_id:t.id, tea_name:t.name, saved_date:t.saveDate, availability:t.available}))
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `vintage-fork-customer-data-${new Date().toISOString().slice(0,10)}.json`;
      document.body.append(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      successFeedback("Your structured JSON export was prepared.", "Download ready");
    }

    applyMotionSetting();
    if (!location.hash) history.replaceState(null, "", "#/dashboard");
    render();
  })();
  </script>
</body>
</html>
